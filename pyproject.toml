[project]
name = "firebinder"
version = "0.1.0"
description = "LangGraph agent that drafts and audits wildfire ICS-209 status summaries from public data"
readme = "README.md"
license = "MIT"
authors = [{ name = "Matthew Gebara" }]
keywords = ["wildfire", "ics-209", "langgraph", "langsmith", "nifc", "firms"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langsmith>=0.3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "shapely>=2.0",
    "feedparser>=6.0",
    "pandas>=2.2",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
]

[project.urls]
Repository = "https://github.com/mggebara/FireBinder"

[project.scripts]
firebinder = "firebinder.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firebinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
